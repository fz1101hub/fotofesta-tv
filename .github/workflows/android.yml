name: Android CI

# Su main e sulle pull request verso main. I tag v* li gestisce release.yml.
on:
  push:
    branches: [main]
    paths-ignore: ["apple/**", "site/**", "docs/**", "**.md"]
  pull_request:
    branches: [main]
    paths-ignore: ["apple/**", "site/**", "docs/**", "**.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Il runner include l'Android SDK. Con i secret PHOTOS_CLIENT_ID e PHOTOS_CLIENT_SECRET l'APK
      # debug include Google Foto; senza, l'app lo segnala quando si sceglie Google Foto.
      - name: Test, lint e build debug
        env:
          PHOTOS_CLIENT_ID: ${{ secrets.PHOTOS_CLIENT_ID }}
          PHOTOS_CLIENT_SECRET: ${{ secrets.PHOTOS_CLIENT_SECRET }}
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug

      - name: Report test e lint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: APK debug
        uses: actions/upload-artifact@v4
        with:
          name: FotoFesta-TV-debug
          path: app/build/outputs/apk/debug/app-debug.apk
