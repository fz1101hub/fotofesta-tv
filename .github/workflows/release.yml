name: Android release

# Genera l'AAB firmato e, su richiesta, lo carica come bozza sulla traccia interna di Google Play.
# Secret richiesti (Settings > Secrets and variables > Actions):
#   RELEASE_KEYSTORE_BASE64, RELEASE_STORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD
# Facoltativi: PHOTOS_CLIENT_ID, PHOTOS_CLIENT_SECRET (Google Foto), PLAY_SERVICE_ACCOUNT_JSON (upload).

on:
  workflow_dispatch:
    inputs:
      upload:
        description: "Carica su Google Play (traccia interna, bozza)"
        type: boolean
        default: false
      without_google:
        description: "Build senza Google Foto (solo se descrizione e scheda non lo citano)"
        type: boolean
        default: false
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Keystore di upload
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::Secret RELEASE_KEYSTORE_BASE64 mancante (vedi docs/PUBLISHING.md)"
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "RELEASE_STORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Credenziali Google Foto
        env:
          PHOTOS_CLIENT_ID: ${{ secrets.PHOTOS_CLIENT_ID }}
          PHOTOS_CLIENT_SECRET: ${{ secrets.PHOTOS_CLIENT_SECRET }}
          PHOTOS_REDIRECT_URI: ${{ vars.PHOTOS_REDIRECT_URI }}
          WITHOUT_GOOGLE: ${{ inputs.without_google }}
        run: |
          if [ -z "$PHOTOS_CLIENT_ID" ] || [ -z "$PHOTOS_CLIENT_SECRET" ] || [ -z "$PHOTOS_REDIRECT_URI" ]; then
            if [ "$WITHOUT_GOOGLE" = "true" ]; then
              echo "::warning::Build senza Google Foto: la scheda Google non comparira' nell'app"
            else
              echo "::error::Secret PHOTOS_CLIENT_ID o PHOTOS_CLIENT_SECRET, o variabile PHOTOS_REDIRECT_URI, mancante (vedi docs/CONFIGURATION.md)"
              exit 1
            fi
          fi

      - name: Test, lint, AAB firmato per Google Play e APK firmato per l'Amazon Appstore
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          PHOTOS_CLIENT_ID: ${{ secrets.PHOTOS_CLIENT_ID }}
          PHOTOS_CLIENT_SECRET: ${{ secrets.PHOTOS_CLIENT_SECRET }}
          PHOTOS_REDIRECT_URI: ${{ vars.PHOTOS_REDIRECT_URI }}
        run: ./gradlew --no-daemon testPlayReleaseUnitTest lintPlayRelease lintAmazonRelease bundlePlayRelease assembleAmazonRelease

      # jarsigner -verify termina con 0 anche su un file non firmato: si controlla il testo.
      - name: Verifica firma
        run: |
          jarsigner -verify app/build/outputs/bundle/playRelease/app-play-release.aab | tee "$RUNNER_TEMP/verify.txt"
          grep -q "jar verified." "$RUNNER_TEMP/verify.txt"
          # L'APK per Fire TV (firma v2): lo verifica apksigner degli strumenti dell'SDK.
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/amazon/release/app-amazon-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FotoFesta-TV-release
          path: |
            app/build/outputs/bundle/playRelease/app-play-release.aab
            app/build/outputs/apk/amazon/release/app-amazon-release.apk
            app/build/outputs/mapping/*/mapping.txt

      - uses: ruby/setup-ruby@v1
        if: ${{ inputs.upload }}
        with:
          ruby-version: "3.3"
          bundler-cache: true

      # Solo dall'avvio manuale con "Carica su Google Play": i tag v* producono soltanto l'artefatto.
      - name: Upload su Google Play
        if: ${{ inputs.upload }}
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::Secret PLAY_SERVICE_ACCOUNT_JSON mancante"
            exit 1
          fi
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/play.json"
          PLAY_JSON_KEY_FILE="$RUNNER_TEMP/play.json" bundle exec fastlane android internal
