<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="referrer" content="no-referrer">
<title>FotoFesta</title>
<style>
  :root { --bg: #0b1222; --card: #17213a; --fg: #eef2fa; --muted: #aab4c8; --accent: #ff7a59; --ok: #6ee7b7; --err: #fca5a5; --line: #2a3654; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-text-size-adjust: 100%; }
  main { max-width: 560px; margin: 0 auto; padding: max(20px, env(safe-area-inset-top)) 16px max(32px, env(safe-area-inset-bottom)); }
  .brand { color: var(--accent); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; font-size: .8rem; }
  h1 { font-size: 1.6rem; line-height: 1.2; margin: .3rem 0 .6rem; }
  p { margin: .4rem 0; overflow-wrap: anywhere; }
  .muted { color: var(--muted); font-size: .92rem; }
  .button { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; margin: 1.2rem 0 .4rem; padding: 18px; border: 0; border-radius: 16px; background: var(--accent); color: #1b1020; font-family: inherit; font-size: 1.15rem; font-weight: 700; line-height: 1.2; text-decoration: none; }
  .button.secondary { background: var(--card); color: var(--fg); border: 1px solid var(--line); }
  .button[hidden] { display: none; }
  .ok { color: var(--ok); font-weight: 600; }
  .err { color: var(--err); font-weight: 600; }
  .note { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-top: 1rem; }
  ol { padding-left: 1.3rem; margin: .6rem 0; }
  li { margin: .3rem 0; }
</style>
</head>
<body>
<main>
  <div class="brand">FotoFesta TV</div>
  <h1 id="title"></h1>
  <section id="start" hidden>
    <p id="intro"></p>
    <a id="go" class="button" href="#" rel="noreferrer">Google</a>
    <p id="startError" class="err" hidden></p>
    <p class="muted" id="scope"></p>
  </section>
  <section id="done" hidden>
    <p class="ok" id="doneText"></p>
    <p id="doneHint"></p>
    <a id="pick" class="button" href="#" hidden target="_blank" rel="noreferrer"></a>
    <p class="muted" id="pickHint" hidden></p>
  </section>
  <section id="cancelled" hidden>
    <p class="err" id="cancelledText"></p>
    <p id="cancelledHint"></p>
  </section>
</main>
<script>
"use strict";
const IT = {
  title: "Google Foto sulla TV",
  intro: "Tocca il pulsante, scegli l’account Google con le tue foto e autorizza FotoFesta. Poi tornerai qui.",
  go: "Continua con Google",
  scope: "FotoFesta vede solo le foto che sceglierai. Questa pagina è servita dalla TV sulla rete di casa.",
  startError: "La TV non risponde: controlla di essere nella stessa Wi‑Fi e inquadra di nuovo il QR.",
  done: "Autorizzazione ricevuta.",
  doneHint: "Guarda la TV: sta aprendo Google Foto.",
  pick: "Scegli le foto",
  pickHint: "Oppure inquadra il nuovo QR sulla TV. Seleziona le foto in Google Foto e premi Fine: la TV se ne accorge da sola.",
  cancelled: "Autorizzazione annullata.",
  cancelledHint: "Chiudi questa pagina e, se vuoi, riprova dalla TV.",
};
const EN = {
  title: "Google Photos on the TV",
  intro: "Tap the button, choose the Google account with your photos and authorize FotoFesta. You’ll come back here afterwards.",
  go: "Continue with Google",
  scope: "FotoFesta only sees the photos you choose. This page is served by the TV on your home network.",
  startError: "The TV isn’t responding: make sure you’re on the same Wi‑Fi and scan the QR code again.",
  done: "Authorization received.",
  doneHint: "Look at the TV: it’s opening Google Photos.",
  pick: "Choose photos",
  pickHint: "Or scan the new QR code on the TV. Select the photos in Google Photos and tap Done: the TV notices by itself.",
  cancelled: "Authorization cancelled.",
  cancelledHint: "Close this page and, if you want, try again from the TV.",
};
const FR = {
  title: "Google Photos sur la TV",
  intro: "Touchez le bouton, choisissez le compte Google qui contient vos photos et autorisez FotoFesta. Vous reviendrez ici ensuite.",
  go: "Continuer avec Google",
  scope: "FotoFesta ne voit que les photos que vous choisissez. Cette page est servie par la TV sur le réseau domestique.",
  startError: "La TV ne répond pas : vérifiez que vous êtes sur le même Wi‑Fi et scannez à nouveau le code QR.",
  done: "Autorisation reçue.",
  doneHint: "Regardez la TV : elle ouvre Google Photos.",
  pick: "Choisir les photos",
  pickHint: "Ou scannez le nouveau code QR sur la TV. Sélectionnez les photos dans Google Photos et validez : la TV le détecte toute seule.",
  cancelled: "Autorisation annulée.",
  cancelledHint: "Fermez cette page et, si vous le souhaitez, réessayez depuis la TV.",
};
const ES = {
  title: "Google Fotos en la TV",
  intro: "Toca el botón, elige la cuenta de Google con tus fotos y autoriza FotoFesta. Después volverás aquí.",
  go: "Continuar con Google",
  scope: "FotoFesta solo ve las fotos que elijas. Esta página la sirve la TV en la red de casa.",
  startError: "La TV no responde: comprueba que estás en la misma Wi‑Fi y escanea de nuevo el código QR.",
  done: "Autorización recibida.",
  doneHint: "Mira la TV: está abriendo Google Fotos.",
  pick: "Elegir las fotos",
  pickHint: "O escanea el nuevo código QR en la TV. Selecciona las fotos en Google Fotos y toca Listo: la TV lo detecta sola.",
  cancelled: "Autorización cancelada.",
  cancelledHint: "Cierra esta página y, si quieres, inténtalo de nuevo desde la TV.",
};
const DE = {
  title: "Google Fotos auf dem Fernseher",
  intro: "Tippe auf die Schaltfläche, wähle das Google-Konto mit deinen Fotos und autorisiere FotoFesta. Danach kommst du hierher zurück.",
  go: "Weiter mit Google",
  scope: "FotoFesta sieht nur die Fotos, die du auswählst. Diese Seite liefert der Fernseher im Heimnetzwerk.",
  startError: "Der Fernseher antwortet nicht: Prüfe, ob du im selben WLAN bist, und scanne den QR‑Code erneut.",
  done: "Autorisierung erhalten.",
  doneHint: "Schau auf den Fernseher: Er öffnet Google Fotos.",
  pick: "Fotos auswählen",
  pickHint: "Oder scanne den neuen QR‑Code auf dem Fernseher. Wähle die Fotos in Google Fotos aus und tippe auf „Fertig“: Der Fernseher merkt es von selbst.",
  cancelled: "Autorisierung abgebrochen.",
  cancelledHint: "Schließe diese Seite und versuche es, wenn du willst, noch einmal vom Fernseher aus.",
};
const TEXTS = { it: IT, en: EN, fr: FR, es: ES, de: DE };
const LANG = (navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || ""])
  .map((code) => String(code).slice(0, 2).toLowerCase())
  .find((code) => TEXTS[code]) || "en";
const T = TEXTS[LANG];
document.documentElement.lang = LANG;
const $ = (id) => document.getElementById(id);

const KEY = new URLSearchParams(location.search).get("k") || "";
const tv = (path) => fetch(path + "?k=" + encodeURIComponent(KEY), { cache: "no-store" });

$("title").textContent = T.title;
$("intro").textContent = T.intro;
$("go").textContent = T.go;
$("scope").textContent = T.scope;
$("startError").textContent = T.startError;
$("doneText").textContent = T.done;
$("doneHint").textContent = T.doneHint;
$("pick").textContent = T.pick;
$("pickHint").textContent = T.pickHint;
$("cancelledText").textContent = T.cancelled;
$("cancelledHint").textContent = T.cancelledHint;

async function start() {
  $("start").hidden = false;
  try {
    const response = await tv("/start");
    const data = response.ok ? await response.json() : {};
    if (!data.url || !/^https:\/\/accounts\.google\.com\//.test(data.url)) throw new Error("url");
    $("go").href = data.url;
  } catch (e) {
    $("go").hidden = true;
    $("startError").hidden = false;
  }
}

// Dopo il consenso la TV crea la sessione Picker: il pulsante per scegliere le foto compare da solo.
async function pollPicker() {
  try {
    const response = await tv("/status");
    if (!response.ok) return;
    const data = await response.json();
    if (data.picker && /^https:\/\//.test(data.picker)) {
      $("pick").href = data.picker;
      $("pick").hidden = false;
      $("pickHint").hidden = false;
      $("doneHint").hidden = true;
      return;
    }
  } catch (e) {
    // La TV non risponde per un momento: si riprova.
  }
  setTimeout(pollPicker, 2000);
}

if (location.hash === "#done") {
  $("done").hidden = false;
  pollPicker();
} else if (location.hash === "#cancelled") {
  $("cancelled").hidden = false;
} else {
  start();
}
</script>
</body>
</html>
