  /* Stessi colori della TV (sfondo, superfici, corallo), più le luci della festa: rosa, viola, oro e menta. */
  :root {
    --bg: #0d0f13; --card: #1b1e25; --raised: #262a33; --line: #343945;
    --fg: #ffffff; --muted: #c8cdd6; --faint: #9aa2af;
    --accent: #ff7a57; --on-accent: #1a0b06; --pink: #ff4f9a; --violet: #8b6cff; --gold: #ffc145; --mint: #4cd787;
    --ok: #6ee7b7; --warn: #fbbf24; --err: #ff9c85; --err-bg: #3a1c1c;
    --party: linear-gradient(120deg, var(--accent) 0%, var(--pink) 55%, var(--violet) 100%);
    --display: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --text: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    --radius: 20px; --radius-s: 14px; --button-radius: 16px;
    color-scheme: dark;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html { background: var(--bg); }
  body { margin: 0; color: var(--fg); font: 17px/1.5 var(--text); -webkit-text-size-adjust: 100%; }
  /* Luci della festa sullo sfondo: tre aloni sfocati, fermi, che non disturbano la lettura. */
  body::before { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background:
      radial-gradient(60vmax 40vmax at 0% -5%, rgba(255,122,87,.30), transparent 60%),
      radial-gradient(55vmax 40vmax at 105% 5%, rgba(255,79,154,.22), transparent 60%),
      radial-gradient(70vmax 45vmax at 50% 110%, rgba(139,108,255,.18), transparent 65%),
      var(--bg); }
  main { max-width: 560px; margin: 0 auto; padding: max(22px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) max(36px, env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left)); }
  button, .pick { touch-action: manipulation; }
  button:focus-visible, textarea:focus-visible, input:focus-visible, summary:focus-visible { outline: 3px solid var(--fg); outline-offset: 2px; }

  /* Intestazione */
  .brand { display: flex; align-items: center; gap: 10px; color: var(--accent); font: 800 .82rem/1 var(--display); letter-spacing: .14em; text-transform: uppercase; }
  .brand svg { width: 64px; height: 18px; flex: none; }
  h1 { font: 800 clamp(1.75rem, 7.4vw, 2.25rem)/1.12 var(--display); letter-spacing: -.01em; margin: .55rem 0 .5rem; text-wrap: balance; }
  p { margin: .4rem 0; overflow-wrap: anywhere; }
  .muted { color: var(--muted); font-size: .94rem; }

  /* Nome e campi */
  label.field { display: block; margin: 1.5rem 0 .4rem; font: 700 .95rem/1.3 var(--display); color: var(--muted); }
  input[type=text], textarea { width: 100%; font: inherit; color: var(--fg); background: var(--raised); border: 1px solid transparent; border-radius: var(--radius-s); padding: 13px 15px; transition: border-color .15s, background .15s; }
  input[type=text]::placeholder, textarea::placeholder { color: var(--faint); }
  input[type=text]:focus, textarea:focus { outline: none; border-color: var(--accent); background: #2c303a; }
  textarea { min-height: 88px; resize: vertical; }

  /* Pulsante principale: manda le foto */
  .pick { position: relative; display: flex; align-items: center; justify-content: center; gap: 12px; width: 100%; min-height: 64px; margin: 1.4rem 0 .5rem; padding: 18px 20px; border-radius: var(--button-radius); background: var(--party); color: var(--on-accent); font: 800 1.2rem/1.2 var(--display); cursor: pointer; box-shadow: 0 10px 30px -8px rgba(255,79,154,.55), inset 0 1px 0 rgba(255,255,255,.35); transition: transform .12s, box-shadow .12s, opacity .2s; }
  .pick:active { transform: scale(.98); box-shadow: 0 6px 18px -8px rgba(255,79,154,.6); }
  .pick .pick-icon { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 10px; background: rgba(26,11,6,.14); flex: none; }
  .pick .pick-icon svg { width: 20px; height: 20px; }
  .pick.off { opacity: .4; pointer-events: none; box-shadow: none; }
  .pick:focus-within { outline: 3px solid var(--fg); outline-offset: 3px; }
  .pick input { position: absolute; width: 1px; height: 1px; opacity: 0; }
  .shots { margin: 1.4rem 0 0; font: 800 1.05rem/1.35 var(--display); }
  .shots small { display: block; font: 400 .92rem/1.4 var(--text); color: var(--muted); }

  /* Invii in corso */
  #summary { margin-top: 1rem; font-weight: 600; min-height: 1.5em; }
  #summary:empty, #list:empty { min-height: 0; margin: 0; }
  ul { list-style: none; margin: .6rem 0 0; padding: 0; display: grid; gap: 8px; }
  li { display: flex; align-items: center; gap: 12px; background: var(--card); border-radius: var(--radius-s); padding: 8px; }
  li .thumb { width: 54px; height: 54px; flex: none; border-radius: 10px; background: var(--raised) center / cover no-repeat; }
  li .text { min-width: 0; flex: 1; }
  li .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: .92rem; }
  li .state { font-size: .88rem; color: var(--muted); }
  li.ok .state { color: var(--ok); }
  li.wait .state { color: var(--warn); }
  li.err .state { color: var(--err); }
  progress { width: 100%; height: 6px; border-radius: 3px; accent-color: var(--accent); }
  #banner { display: none; margin-top: 1rem; padding: 14px 16px; border-radius: var(--radius-s); background: var(--err-bg); color: var(--err); font-weight: 600; }
  #banner button { display: block; margin-top: 10px; padding: 11px 20px; border: 0; border-radius: var(--button-radius); background: var(--accent); color: var(--on-accent); font: 700 1rem/1.2 var(--display); cursor: pointer; }

  /* Schede: gioco in corso (bordo con i colori della festa) e riquadri normali */
  .game, .box { margin: 1.1rem 0; padding: 18px; border-radius: var(--radius); background: var(--card); }
  .box { border: 1px solid rgba(255,255,255,.06); }
  .game { border: 2px solid transparent; background: linear-gradient(var(--card), var(--card)) padding-box, var(--party) border-box; box-shadow: 0 14px 40px -18px rgba(255,79,154,.5); }
  .game-kicker, .announce-kicker { display: inline-block; font: 800 .74rem/1 var(--display); letter-spacing: .14em; text-transform: uppercase; }
  .game-kicker { color: var(--accent); }
  .game-question { font: 800 1.35rem/1.25 var(--display); margin: .45rem 0 .8rem; text-wrap: balance; }
  .box-title { display: block; font: 800 1.08rem/1.3 var(--display); margin: 0 0 .7rem; }
  .choices { display: grid; gap: 10px; }
  .choices button { min-height: 54px; font: 600 1.02rem/1.3 var(--text); text-align: left; padding: 14px 16px; border-radius: var(--radius-s); border: 2px solid transparent; background: var(--raised); color: var(--fg); cursor: pointer; overflow-wrap: anywhere; transition: transform .1s, background .15s, border-color .15s; }
  .choices button:active:not(:disabled) { transform: scale(.98); }
  .choices button:disabled { cursor: default; }
  .choices button.mine { border-color: var(--accent); background: rgba(255,122,87,.16); }
  .choices button.right { border-color: var(--mint); background: var(--mint); color: #08210f; }
  #gameStatus, #playStatus { margin-top: .75rem; font-weight: 600; min-height: 1.4em; }
  #gameStatus:empty, #playStatus:empty, #messageStatus:empty { min-height: 0; margin: 0; }

  /* Reazioni */
  .reactions { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
  .reactions button { aspect-ratio: 1; font-size: 1.65rem; line-height: 1; padding: 0; border-radius: var(--button-radius); border: 0; background: var(--raised); cursor: pointer; transition: transform .15s; }
  .reactions button:active { transform: scale(.92); }
  .reactions button.sent { animation: pop .35s ease-out; background: rgba(255,122,87,.25); }
  @keyframes pop { 0% { transform: scale(1); } 45% { transform: scale(1.3) rotate(-8deg); } 100% { transform: scale(1); } }

  /* Pulsanti secondari e di invio */
  .send { margin-top: 10px; width: 100%; min-height: 50px; padding: 13px; border: 0; border-radius: var(--button-radius); background: var(--accent); color: var(--on-accent); font: 800 1.02rem/1.2 var(--display); cursor: pointer; transition: transform .1s; }
  .send:active:not(:disabled) { transform: scale(.98); }
  .send:disabled { opacity: .5; cursor: default; }
  .ghost { background: var(--raised) !important; color: var(--fg) !important; }
  #messageStatus { margin-top: .5rem; font-weight: 600; min-height: 1.4em; }

  /* Annunci e pausa senza telefoni: banda con i colori della festa e qualche coriandolo */
  .announce { position: relative; overflow: hidden; margin: 1.1rem 0; padding: 18px 20px; border-radius: var(--radius); background: var(--party); color: var(--on-accent); box-shadow: 0 14px 40px -16px rgba(255,79,154,.6); }
  .announce::after { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .5;
    background:
      radial-gradient(circle at 88% 22%, var(--gold) 0 4px, transparent 5px),
      radial-gradient(circle at 76% 70%, #fff 0 3px, transparent 4px),
      radial-gradient(circle at 94% 82%, var(--mint) 0 3px, transparent 4px),
      radial-gradient(circle at 66% 18%, #fff 0 2px, transparent 3px); }
  .announce p { position: relative; font: 800 1.35rem/1.25 var(--display); margin: .35rem 0 0; }

  /* Arrivo dal QR dell'ingresso */
  .arrive input[type=text] { margin-top: .8rem; background: rgba(255,255,255,.9); color: var(--on-accent); }
  .arrive input[type=text]::placeholder { color: rgba(26,11,6,.55); }
  .arrive input[type=text]:focus { border-color: var(--on-accent); background: #fff; }
  .arrive-go { position: relative; margin-top: 10px; width: 100%; min-height: 54px; border: 0; border-radius: var(--button-radius); background: var(--on-accent); color: #fff; font: 800 1.1rem/1.2 var(--display); cursor: pointer; }
  .arrive-go:disabled { opacity: .6; }
  #arriveStatus { position: relative; margin: .6rem 0 0; font-weight: 700; }
  #arriveStatus:empty { display: none; }

  /* Silent disco: banda viola, con le onde che si muovono mentre suona */
  .disco { background: linear-gradient(120deg, var(--violet) 0%, var(--pink) 100%); color: #fff; box-shadow: 0 14px 40px -16px rgba(139,108,255,.7); }
  .disco .announce-kicker { color: #fff; }
  .disco > p:not(#discoStatus) { font: 700 1.05rem/1.35 var(--display); }
  .disco .arrive-go { background: #fff; color: #3b1f8f; }
  .disco .arrive-go.on { background: rgba(255,255,255,.18); color: #fff; box-shadow: inset 0 0 0 2px rgba(255,255,255,.6); }
  #discoStatus { position: relative; display: flex; align-items: center; gap: 10px; margin: .7rem 0 0; font: 700 .95rem/1.3 var(--display); }
  #discoStatus:empty { display: none; }
  .bars { display: inline-flex; align-items: flex-end; gap: 3px; height: 18px; flex: none; }
  .bars i { width: 4px; height: 30%; border-radius: 2px; background: #fff; }
  .playing .bars i { animation: bar .9s ease-in-out infinite alternate; }
  .playing .bars i:nth-child(2) { animation-delay: -.3s; }
  .playing .bars i:nth-child(3) { animation-delay: -.6s; }
  .playing .bars i:nth-child(4) { animation-delay: -.15s; }
  @keyframes bar { from { height: 20%; } to { height: 100%; } }

  /* Togli la tua foto, porta a casa, ricordo, firma, canzoni */
  li .remove { display: none; flex: none; min-height: 40px; padding: 0 12px; border: 0; border-radius: 12px; background: var(--raised); color: var(--muted); font: 700 .86rem/1 var(--display); cursor: pointer; }
  body.can-delete li .remove { display: block; }
  li.gone { opacity: .55; }
  li.gone .thumb { filter: grayscale(1); }
  .take-actions { display: grid; gap: 8px; }
  .take-actions a, .take-actions button { display: flex; align-items: center; justify-content: center; min-height: 52px; border-radius: var(--button-radius); border: 0; font: 800 1rem/1.2 var(--display); text-decoration: none; cursor: pointer; }
  .take-actions a { background: var(--accent); color: var(--on-accent); }
  .take-actions button { background: var(--raised); color: var(--fg); }
  #signBox { margin: .9rem 0 0; }
  #signBox summary { cursor: pointer; font-weight: 700; color: var(--muted); padding: 6px 0; }
  #signPad { display: block; width: 100%; height: 150px; margin-top: .5rem; border-radius: var(--radius-s); background: rgba(255,255,255,.92); touch-action: none; }
  .check { display: flex; align-items: center; gap: 10px; margin-top: .6rem; font-weight: 600; }
  .check input { width: 22px; height: 22px; accent-color: var(--accent); }
  .song-list { display: grid; gap: 6px; margin-top: .5rem; }
  .song-list .item { display: flex; align-items: center; gap: 10px; background: var(--raised); border-radius: var(--radius-s); padding: 8px 10px; }
  .song-list .text { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .song-list button { flex: none; min-height: 40px; padding: 0 14px; border: 0; border-radius: 12px; background: var(--mint); color: #08210f; font: 800 .9rem/1 var(--display); cursor: pointer; }
  #invite canvas { display: block; width: 100%; height: auto; margin-top: .6rem; border-radius: var(--radius-s); }
  #invite input, #invite textarea { margin-top: 8px; }

  /* Evento: nome e logo scelti dalla regia, scaletta della serata */
  #event { display: flex; align-items: center; gap: 12px; margin-top: .9rem; }
  #event img { height: 44px; max-width: 120px; object-fit: contain; border-radius: 8px; }
  #eventName { font: 800 1.05rem/1.2 var(--display); color: var(--accent); }
  .schedule { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
  .schedule li { display: flex; gap: 12px; background: var(--raised); padding: 10px 12px; }
  .schedule li b { font-family: var(--display); color: var(--accent); min-width: 3.2em; }
  .schedule li.past { opacity: .5; }
  .swatches { display: flex; flex-wrap: wrap; gap: 10px; margin: 8px 0; }
  .swatches button { width: 40px; height: 40px; border-radius: 50%; border: 3px solid transparent; cursor: pointer; }
  .swatches button.on { border-color: var(--fg); }
  .thumbs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .thumbs .t { position: relative; }
  .thumbs img { width: 84px; height: 56px; object-fit: contain; background: #fff; border-radius: 8px; }
  .thumbs button { position: absolute; top: -8px; right: -8px; width: 28px; height: 28px; border-radius: 50%; border: 0; background: var(--err); color: #000; font-weight: 800; cursor: pointer; }
  .upload { display: inline-flex; align-items: center; min-height: 44px; padding: 0 16px; margin-top: 8px; border-radius: 12px; background: var(--raised); font-weight: 700; cursor: pointer; }
  .upload input { position: absolute; width: 1px; height: 1px; opacity: 0; }
  #setupBox textarea { min-height: 110px; }
  .kids { list-style: none; padding: 0; margin: 8px 0; display: flex; flex-wrap: wrap; gap: 8px; }
  .kids li { display: flex; align-items: center; gap: 6px; background: var(--raised); border-radius: 999px; padding: 4px 4px 4px 12px; }
  .kids button { width: 28px; height: 28px; border-radius: 50%; border: 0; background: var(--err); color: #000; font-weight: 800; cursor: pointer; }

  /* Testo più grande e contrasto alto */
  html.large { font-size: 118%; }
  @media (prefers-contrast: more) {
    :root { --muted: #e6e9ef; --faint: #c8cdd6; }
    .box, li { border: 1px solid rgba(255,255,255,.35); }
  }
  :focus-visible { outline: 3px solid var(--fg); outline-offset: 2px; }

  /* Cabina per un tablet: solo il grande pulsante per scattare */
  body.booth main > *:not(#pick):not(#boothStatus):not(.brand):not(h1):not(#list) { display: none !important; }
  body.booth #pick { min-height: 46vh; font-size: 1.6rem; }
  body.booth #list li:nth-child(n+2) { display: none; }
  #boothStatus { margin-top: 1rem; font: 800 1.3rem/1.3 var(--display); text-align: center; min-height: 1.4em; }

  /* Muro di telefoni: a tutto schermo il numero del telefono, poi il suo pezzo di foto */
  .wallcard { background: linear-gradient(120deg, var(--accent) 0%, var(--gold) 100%); }
  #phoneWallScreen { position: fixed; inset: 0; z-index: 60; background: #000; display: grid; place-items: center; touch-action: none; }
  #phoneWallScreen canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #phoneWallNumber { position: relative; color: #fff; font: 900 min(60vw, 40vh)/1 var(--display); text-shadow: 0 0 40px rgba(255,122,87,.8); }
  #phoneWallHint { position: absolute; left: 16px; right: 16px; bottom: max(24px, env(safe-area-inset-bottom)); color: rgba(255,255,255,.75); font: 700 1rem/1.3 var(--display); text-align: center; }
  #phoneWallExit { position: absolute; top: max(12px, env(safe-area-inset-top)); right: max(12px, env(safe-area-inset-right)); width: 44px; height: 44px; border: 0; border-radius: 50%; background: rgba(255,255,255,.16); color: #fff; font-size: 1.2rem; cursor: pointer; }
  @media (prefers-reduced-motion: reduce) { .playing .bars i { animation: none; height: 70%; } }
  .links a { display: block; text-align: center; text-decoration: none; }

  /* Telecomando (regista e regia) */
  .remote { display: grid; grid-template-columns: 1fr 1.3fr 1fr; gap: 8px; margin-top: .7rem; }
  .remote button, .wide { min-height: 54px; font: 700 1rem/1.2 var(--display); padding: 14px 8px; border-radius: var(--radius-s); border: 0; background: var(--raised); color: var(--fg); cursor: pointer; transition: transform .1s; }
  .remote button:active, .wide:active { transform: scale(.97); }
  .remote button:nth-child(2) { background: var(--accent); color: var(--on-accent); }
  .wide { width: 100%; margin-top: 8px; }
  .row { display: flex; gap: 8px; margin-top: 10px; }
  .row input { flex: 1; min-width: 0; }
  .row button { flex: none; padding: 0 18px; border: 0; border-radius: var(--button-radius); background: var(--accent); color: var(--on-accent); font: 800 1rem/1 var(--display); cursor: pointer; }
  .pending { display: grid; gap: 8px; margin-top: .6rem; }
  .pending .item { display: flex; align-items: center; gap: 10px; background: var(--raised); border-radius: var(--radius-s); padding: 8px; }
  .pending img { width: 64px; height: 64px; object-fit: cover; border-radius: 10px; background: var(--line); flex: none; }
  .pending .text { flex: 1; min-width: 0; font-size: .92rem; overflow-wrap: anywhere; }
  .pending button { flex: none; min-height: 40px; font: 700 .92rem/1 var(--display); padding: 10px 12px; border-radius: 12px; border: 0; cursor: pointer; }
  .pending .yes { background: var(--mint); color: #08210f; }
  .pending .no { background: var(--err-bg); color: var(--err); }
  details summary { cursor: pointer; font: 700 1rem/1.4 var(--display); padding: 6px 0; }
  #speechText { min-height: 160px; font-size: 1.15rem; line-height: 1.5; }

  /* Giochi: parola segreta, disegni, elenchi */
  .secret { margin: .5rem 0 .7rem; padding: 14px 16px; border-radius: var(--radius-s); background: linear-gradient(120deg, rgba(255,193,69,.95), rgba(255,122,87,.95)); color: var(--on-accent); font: 800 1.12rem/1.35 var(--display); overflow-wrap: anywhere; }
  .canvas-wrap { position: relative; margin-top: .7rem; }
  .canvas-wrap canvas { display: block; width: 100%; aspect-ratio: 1; border-radius: var(--radius-s); background: #fff; touch-action: none; box-shadow: inset 0 0 0 1px rgba(0,0,0,.06); }
  .palette { display: grid; grid-template-columns: repeat(8, 1fr); gap: 8px; margin-top: 10px; }
  .palette button { aspect-ratio: 1; border-radius: 50%; border: 3px solid var(--card); box-shadow: 0 0 0 1px var(--line); cursor: pointer; transition: transform .12s; }
  .palette button.on { box-shadow: 0 0 0 2px var(--fg); transform: scale(1.12); }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  #playList { margin: .5rem 0 0; padding-left: 1.2rem; display: block; }
  #playList li { display: list-item; background: none; padding: 4px 0; border-radius: 0; }
  #lights { position: fixed; inset: 0; z-index: 50; display: flex; align-items: flex-end; justify-content: center; padding: 0 16px max(28px, env(safe-area-inset-bottom)); color: #fff; font: 800 1.05rem/1.3 var(--display); text-align: center; text-shadow: 0 1px 6px rgba(0,0,0,.6); }
  #treasureStatus { margin: 1.1rem 0; padding: 16px 18px; border-radius: var(--radius); background: var(--card); border: 2px solid var(--gold); font: 800 1.05rem/1.35 var(--display); }

  /* Coda della pagina */
  .note { margin-top: 1.8rem; padding-top: 1rem; border-top: 1px solid rgba(255,255,255,.08); }
  .note .muted { font-size: .86rem; color: var(--faint); }
  .linkish { background: none; border: 0; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; font: inherit; padding: 6px 0; cursor: pointer; }

  /* Coriandoli quando una foto arriva sulla TV o la risposta è giusta */
  #confetti { position: fixed; inset: 0; z-index: 70; pointer-events: none; width: 100%; height: 100%; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    #confetti { display: none; }
  }
</style>
</head>
<body>
<main>
  <div class="brand"><span>FotoFesta</span><svg viewBox="0 0 64 18" aria-hidden="true"><rect x="2" y="7" width="7" height="3" rx="1.5" fill="#ffc145" transform="rotate(-25 5 8)"/><circle cx="17" cy="5" r="2.2" fill="#ff4f9a"/><rect x="24" y="10" width="7" height="3" rx="1.5" fill="#4cd787" transform="rotate(30 27 11)"/><circle cx="37" cy="12" r="2" fill="#8b6cff"/><rect x="43" y="3" width="7" height="3" rx="1.5" fill="#ff7a57" transform="rotate(15 46 4)"/><circle cx="57" cy="9" r="2.2" fill="#3da9fc"/></svg></div>
  <div id="event" hidden><img id="eventLogo" alt="" hidden><span id="eventName"></span></div>
  <h1 id="title"></h1>
  <p class="muted" id="intro"></p>

  <!-- Annuncio della regia: resta in cima per un minuto. -->
  <div id="announcement" class="announce" hidden role="status">
    <div class="announce-kicker" id="announceKicker"></div>
    <p id="announceText"></p>
  </div>

  <!-- Arrivo dal QR dell'ingresso: la TV dà il benvenuto a chi tocca "Eccomi!". -->
  <section id="arrive" class="announce arrive" hidden>
    <div class="announce-kicker" id="arriveKicker"></div>
    <p id="arriveTitle"></p>
    <input type="text" id="arriveName" maxlength="40" autocomplete="nickname" enterkeyhint="go">
    <button type="button" class="arrive-go" id="arriveGo"></button>
    <p id="arriveStatus" aria-live="polite"></p>
  </section>

  <!-- Silent disco: la musica che la TV suona a volume zero, nelle cuffie, allineata alla TV. -->
  <section id="disco" class="announce disco" hidden>
    <div class="announce-kicker" id="discoTitle"></div>
    <p id="discoBody"></p>
    <button type="button" class="arrive-go" id="discoToggle"></button>
    <p id="discoStatus" aria-live="polite"></p>
    <audio id="discoAudio" preload="none" playsinline></audio>
  </section>

  <!-- Muro di telefoni: i telefoni sul tavolo formano insieme una foto grande. -->
  <section id="phoneWall" class="announce wallcard" hidden>
    <div class="announce-kicker" id="phoneWallTitle"></div>
    <p id="phoneWallBody"></p>
    <button type="button" class="arrive-go" id="phoneWallJoin"></button>
    <p id="phoneWallStatus" aria-live="polite"></p>
  </section>
  <div id="phoneWallScreen" hidden>
    <canvas id="phoneWallCanvas"></canvas>
    <div id="phoneWallNumber"></div>
    <div id="phoneWallHint"></div>
    <button type="button" id="phoneWallExit"></button>
  </div>

  <!-- Tre minuti senza telefoni: la TV non accetta foto, reazioni e dediche. -->
  <div id="quiet" class="announce" hidden role="status">
    <div class="announce-kicker" id="quietKicker"></div>
    <p id="quietText"></p>
  </div>

  <!-- Regista per due minuti: compare solo sul telefono estratto. -->
  <section id="director" class="game" hidden aria-live="polite">
    <div class="game-kicker" id="directorKicker"></div>
    <p class="game-question" id="directorText"></p>
    <div class="remote">
      <button type="button" data-director="previous" id="directorPrev"></button>
      <button type="button" data-director="pause" id="directorPause"></button>
      <button type="button" data-director="next" id="directorNext"></button>
    </div>
  </section>

  <p id="treasureStatus" hidden role="status"></p>

  <!-- Giochi con i telefoni oltre ai quiz: disegni, frasi, missioni, talpa, capsula del tempo. -->
  <section id="play" class="game" hidden aria-live="polite">
    <div class="game-kicker" id="playKicker"></div>

const KEY = new URLSearchParams(location.search).get("k") || "";
const senderInput = $("sender");
try { senderInput.value = localStorage.getItem("fotofesta.sender") || ""; } catch (e) {}
senderInput.addEventListener("input", () => {

// Gioco con i telefoni: la pagina chiede alla TV se c'è una domanda e manda la risposta scelta.
// Il telefono ha un identificativo casuale, così la TV conta una risposta per telefono e i punti.
const PLAYER = (() => {
  try {
    let id = localStorage.getItem("fotofesta.player");
    if (!id || !/^[A-Za-z0-9_-]{8,64}$/.test(id)) {
      id = randomId();
      localStorage.setItem("fotofesta.player", id);
    }
    return id;
  } catch (e) {
    return randomId();
  }
})();
const game = { round: null, choice: null };

// Una sola richiesta per tutto: cosa la TV permette (reazioni, dediche) e il gioco in corso.
async function pollGame() {
  if (document.hidden || expired) return;
  try {
    const response = await fetch("/party?player=" + encodeURIComponent(PLAYER), {
      headers: { "X-FotoFesta-Key": KEY },
      cache: "no-store",
    });
    if (response.ok) {
      const state = await response.json();
      showFeatures(state.features || {});
      showGame(state.game);
      showParty(state.party || {});
      showPlay(state.play || null);
      showSetup(state.setup || null);
      showDisco(state.disco || null);
      showPhoneWall(state.phoneWall || null);
      $("host").hidden = !state.host;
    }
  } catch (e) {
    // La TV non risponde per un momento: si riprova al giro successivo.
  }
}

function showFeatures(features) {
  $("react").hidden = !features.reactions;
  $("message").hidden = !features.messages;
  arrivalsOn = !!features.arrivals;
  showArrive();
  // Ingresso e parete delle foto: solo le TV che li servono (Android TV e Fire TV).
  $("hostLinks").hidden = !features.wall;
  $("songs").hidden = !features.songs;
  albumOn = !!features.album;
  videoOn = !!features.video && !BOOTH;
  $("files").accept = videoOn ? "image/*,video/*" : "image/*";
  document.body.classList.toggle("can-delete", !!features.delete);
  showTakeHome();
}

function showQuiet() {
  $("quiet").hidden = !quietLeft;
  if (quietLeft) $("quietText").textContent = T.quietText.replace("%s", Math.floor(quietLeft / 60) + ":" + String(quietLeft % 60).padStart(2, "0"));
  updatePick();
}

// Una foto a testa o rullino usa e getta: quanti scatti restano a questo telefono.
function showShots() {
  const box = $("shots");
  box.hidden = !shots;
  $("hostDevelop").hidden = !(shots && shots.disposable && !shots.developed);
  updatePick();
  if (!shots) return;
  const left = Math.max(0, shots.left | 0);
  box.textContent = left ? T.shotsLeft(left, shots.limit | 0) : T.shotsNone;
  const note = shots.disposable ? (shots.developed ? T.shotsDeveloped : T.shotsDisposable) : "";
  if (note) {
    const small = document.createElement("small");
    small.textContent = note;
    box.appendChild(small);
  }
}

function updatePick() {
  const off = quietLeft > 0 || !!(shots && (shots.left | 0) <= 0);
  $("pick").classList.toggle("off", off);
  $("files").disabled = off;
}

// Giochi con i telefoni: la TV dice cosa mostrare, la pagina disegna l'occorrente e manda i contributi.
const COLORS = ["#111111", "#E53935", "#FB8C00", "#FDD835", "#43A047", "#1E88E5", "#8E24AA", "#FFFFFF"];
const play = { round: null, game: null, offset: 0, target: null, color: 0, strokes: [], dirty: false, live: null, lightsSeen: 0, lightsTimer: null, momentTimer: null };
$("playKicker").textContent = T.playKicker;
$("drawClear").textContent = T.playClear;
$("drawSend").textContent = T.playSend;
$("playTextSend").textContent = T.playSend;
$("lightsHint").textContent = T.lightsHint;
COLORS.forEach((color, index) => {
  const button = document.createElement("button");
  button.type = "button";
  button.style.background = color;
  button.setAttribute("aria-label", color);
  button.addEventListener("click", () => {
    play.color = index;
    document.querySelectorAll("#palette button").forEach((b, i) => b.classList.toggle("on", i === index));
  });
  if (index === 0) button.classList.add("on");
  $("palette").appendChild(button);
});

function showPlay(state) {
  if (!state) { $("play").hidden = true; showLights(null, 0); return; }
  play.offset = (state.now || Date.now()) - Date.now();
  $("playCoins").hidden = !(state.coins > 0);
  $("playCoins").textContent = T.coins.replace("%s", state.coins | 0);
  showLights(state.lights || null);
  const game = state.game;
  $("play").hidden = !game;
  if (!game) { play.game = null; play.round = null; stopMomentTimer(); return; }
  if (game.round !== play.round) {
    // Nuovo gioco o nuovo turno: si riparte puliti.
    play.round = game.round;
    play.target = null;
    play.strokes = [];
    play.dirty = false;
    $("playTextInput").value = "";
    $("playStatus").textContent = "";
    drawStrokes($("drawCanvas"), []);
  }
  play.game = game;
  renderPlay();
}

function renderPlay() {
  const game = play.game;
  if (!game) return;
  const kind = game.kind;
  $("playTitle").textContent = T["t_" + kind] || "";
  $("playPrompt").textContent = game.prompt || "";
  let info = "";
  let secret = "";
  let input = game.input;
  let choices = [];
  let list = null;
  let previousDrawing = null;
  switch (kind) {
    case "draw_guess":
      if (game.winner) info = T.guessWon.replace("%1", game.winner).replace("%2", game.answer || "");
      else if (game.revealed) info = T.guessAnswer.replace("%s", game.answer || "");
      else if (game.you) secret = T.drawYou.replace("%s", game.secret || "");
      else info = T.drawGuess.replace("%s", game.special || "");
      break;
    case "wall": info = T.wallHint; break;
    case "story":
      if (game.mine) { info = T.storyMine; input = "none"; }
      else if (game.previous) { info = T.storyPrevious; secret = game.previous; }
      break;
    case "whisper":
      if (game.turn) {
        info = (input === "draw" ? T.whisperDraw : T.whisperDescribe) + " " + T.whisperLeft.replace("%s", formatSeconds(game.seconds | 0));
        if (game.previousDrawing) previousDrawing = game.previousDrawing;
        else secret = game.previous || "";
      } else {
        info = game.done ? T.whisperDone : T.whisperWait;
        input = "none";
      }
      break;
    case "compliments":
      info = T.complimentTo + " " + T.complimentHint;
      choices = game.choices || [];
      break;
    case "missions":
      if (game.secret) { info = T.missionYour; secret = game.secret + " · " + T.missionHint; }
      break;
    case "paparazzi": info = game.you ? T.paparazziStar : T.paparazziHunt.replace("%s", game.special || ""); break;
    case "moment": info = momentText(game); startMomentTimer(); break;
    case "recreate": info = T.recreateHint; break;
    case "mole":
      if (game.revealed) info = (game.caught ? T.moleCaught : T.moleFree).replace("%s", game.special || "");
      else if (game.voting) { info = game.voted ? T.moleVoted.replace("%s", game.voted) : T.moleVote; choices = game.choices || []; }
      else if (game.you) { info = T.moleYou; secret = game.secret || ""; }
      else info = T.moleOthers;
      break;
    case "capsule":
      if (game.revealed) { info = T.capsuleOpen; list = game.entries || []; }
      else info = T.capsuleHint;
      break;
  }
  if (kind !== "moment") stopMomentTimer();
  $("playInfo").textContent = info;
  $("playSecret").hidden = !secret;
  $("playSecret").textContent = secret;
  $("playPreviousWrap").hidden = !previousDrawing;
  if (previousDrawing) drawStrokes($("playPrevious"), parseDrawing(previousDrawing));
  $("playList").hidden = !list;
  $("playList").textContent = "";
  (list || []).forEach((text) => { const li = document.createElement("li"); li.textContent = text; $("playList").appendChild(li); });
  renderChoices(kind, choices, game);
  $("playDraw").hidden = input !== "draw";
  $("playText").hidden = input !== "text";
  $("playTextInput").placeholder = kind === "draw_guess" ? T.drawGuess.replace("%s", game.special || "").replace(/[:：]\s*$/, "") : "";
  // Chi disegna in "Disegna e indovina" manda il disegno da solo, mentre lo fa.
  $("drawSend").hidden = kind === "draw_guess";
}

function renderChoices(kind, choices, game) {
  const box = $("playChoices");
  const names = choices.join("\n");
  if (box.dataset.names === names + kind && box.childElementCount === choices.length) {
    box.querySelectorAll("button").forEach((b) => b.classList.toggle("mine", b.textContent === (kind === "mole" ? game.voted : play.target)));
    return;
  }
  box.dataset.names = names + kind;
  box.textContent = "";
  choices.forEach((name) => {
    const button = document.createElement("button");
    button.type = "button";
    button.textContent = name;
    button.classList.toggle("mine", name === (kind === "mole" ? game.voted : play.target));
    button.addEventListener("click", () => {
      if (kind === "mole") {
        sendPlay({ command: "vote", target: name });
      } else {
        play.target = name;
        box.querySelectorAll("button").forEach((b) => b.classList.toggle("mine", b === button));
      }
    });
    box.appendChild(button);
  });
}

function formatSeconds(seconds) {
  return Math.floor(seconds / 60) + ":" + String(seconds % 60).padStart(2, "0");
}

function momentText(game) {
  const now = Date.now() + play.offset;
  const left = Math.ceil((game.moment - now) / 1000);
  if (left > 0) return T.momentReady.replace("%s", String(left));
  if (now < game.moment + 60000) return T.momentNow;
  return T.momentDone;
}

function startMomentTimer() {
  if (play.momentTimer) return;
  play.momentTimer = setInterval(() => {
    if (play.game && play.game.kind === "moment") $("playInfo").textContent = momentText(play.game);
  }, 250);
}

function stopMomentTimer() {
  if (play.momentTimer) { clearInterval(play.momentTimer); play.momentTimer = null; }
}

async function sendPlay(fields) {
  if (!play.round) return;
  let status = T.playFailed;
  try {
    const response = await sendAction(Object.assign({ type: "play", round: play.round }, fields));
    let body = null;
    try { body = await response.json(); } catch (e) {}
    if (response.ok) {
      if (body && body.status === "correct") celebrate();
      status = body && body.status === "correct" ? T.guessRight : body && body.status === "wrong" ? T.guessWrong : T.playSent;
      if (fields.text !== undefined) $("playTextInput").value = "";
    } else if (response.status === 429) status = T.playRate;
    else if (response.status === 409) status = T.playClosed;
    else if (response.status === 423) status = T.quietRefused;
  } catch (e) {}
  if (fields.command !== "live") $("playStatus").textContent = status;
  pollGame();
}

$("playTextSend").addEventListener("click", sendPlayText);
$("playTextInput").addEventListener("keydown", (event) => {
  if (event.key === "Enter" && !event.shiftKey) { event.preventDefault(); sendPlayText(); }
});

function sendPlayText() {
  const text = $("playTextInput").value.trim();
  if (!text || !play.game) return;
  if (play.game.kind === "compliments" && !play.target) { $("playStatus").textContent = T.playNeedTarget; return; }
  const fields = { text: Array.from(text).slice(0, 200).join("") };
  if (play.game.kind === "compliments") fields.target = play.target;
  sendPlay(fields);
}

// Disegno: tratti nelle coordinate 0–1000 della tela quadrata, "colore,x,y,x,y;...".
const canvas = $("drawCanvas");
let drawing = null;
canvas.addEventListener("pointerdown", (event) => {
  event.preventDefault();
  canvas.setPointerCapture(event.pointerId);
  drawing = { c: play.color, p: [] };
  play.strokes.push(drawing);
  addPoint(event);
});
canvas.addEventListener("pointermove", (event) => { if (drawing) addPoint(event); });
["pointerup", "pointercancel"].forEach((name) => canvas.addEventListener(name, () => { drawing = null; }));

function addPoint(event) {
  const rect = canvas.getBoundingClientRect();
  const x = Math.max(0, Math.min(1000, Math.round((event.clientX - rect.left) / rect.width * 1000)));
  const y = Math.max(0, Math.min(1000, Math.round((event.clientY - rect.top) / rect.height * 1000)));
  const points = drawing.p;
  const n = points.length;
  if (n >= 2 && Math.abs(points[n - 2] - x) + Math.abs(points[n - 1] - y) < 6) return;
  // Oltre il limite della TV il disegno smette di crescere.
  if (encodeDrawing().length > 19000 || play.strokes.length > 390) return;
  points.push(x, y);
  play.dirty = true;
  drawStrokes(canvas, play.strokes);
}

function encodeDrawing() {
  return play.strokes.filter((s) => s.p.length >= 2).map((s) => [s.c].concat(s.p).join(",")).join(";");
}

function parseDrawing(text) {
  return String(text || "").split(";").map((stroke) => {
    const numbers = stroke.split(",").map((n) => parseInt(n, 10));
    return { c: numbers[0] | 0, p: numbers.slice(1) };
  }).filter((s) => s.p.length >= 2);
}

function drawStrokes(target, strokes) {
  const context = target.getContext("2d");
  const size = target.width;
  context.fillStyle = "#fff";
  context.fillRect(0, 0, size, size);
  context.lineCap = "round";
  context.lineJoin = "round";
  context.lineWidth = size * 0.012;
  strokes.forEach((stroke) => {
    const color = COLORS[stroke.c] || COLORS[0];
    context.strokeStyle = color;
    context.fillStyle = color;
    const p = stroke.p;
    if (p.length === 2) {
      context.beginPath();
      context.arc(p[0] / 1000 * size, p[1] / 1000 * size, size * 0.012, 0, Math.PI * 2);
      context.fill();
      return;
    }
    context.beginPath();
    context.moveTo(p[0] / 1000 * size, p[1] / 1000 * size);
    for (let i = 2; i + 1 < p.length; i += 2) context.lineTo(p[i] / 1000 * size, p[i + 1] / 1000 * size);
    context.stroke();
  });
}

// Telefoni come luci: lo stesso colore su tutti i telefoni, calcolato dall'ora della TV.
function showLights(lights) {
  const box = $("lights");
  if (!lights || lights.started === play.lightsSeen) {
    box.hidden = true;
    if (play.lightsTimer) { cancelAnimationFrame(play.lightsTimer); play.lightsTimer = null; }
    return;
  }
  box.hidden = false;
  box.onclick = () => { play.lightsSeen = lights.started; showLights(null); };
  const seed = Array.from(PLAYER).reduce((sum, c) => sum + c.charCodeAt(0), 0) % 360;
  const frame = () => {
    const t = (Date.now() + play.offset - lights.started) / 1000;
    let color;
    switch (lights.pattern) {
      case "wave": color = "hsl(" + ((t * 60 + seed) % 360) + ",90%,55%)"; break;
      case "pulse": color = "hsl(330,90%," + (25 + 30 * (0.5 + 0.5 * Math.sin(t * Math.PI * 2))) + "%)"; break;
      case "candle": color = "hsl(" + (30 + 8 * Math.sin(t * 3 + seed)) + ",100%," + (40 + 10 * Math.sin(t * 7.3 + seed) + 5 * Math.sin(t * 13.1)) + "%)"; break;
      default: color = "hsl(" + ((t * 60) % 360) + ",90%,55%)";
    }
    box.style.background = color;
    play.lightsTimer = requestAnimationFrame(frame);
  };
  if (!play.lightsTimer) play.lightsTimer = requestAnimationFrame(frame);
}

    button.textContent = state.choices[index] + (tally ? " · " + T.votes(tally[index] || 0) : "");
  });
  let status = "";
  if (state.poll) {

  } else if (state.open) {
    status = game.choice !== null ? T.gameAnswered : (senderInput.value.trim() ? "" : T.gameNoName);
  } else if (typeof state.answer === "number") {
    status = game.choice === null ? T.gameClosed : (game.choice === state.answer ? T.gameRight(state.points) : T.gameWrong(state.points));

    status = T.gameClosed;
  }

// Attese tra un tentativo e l'altro quando la TV non risponde o è occupata: circa un minuto in tutto.
const RETRY_DELAYS = [2000, 4000, 8000, 16000, 30000];

const queue = [];
let total = 0;
let done = 0;
let running = false;
// La TV non risponde: la coda aspetta "Riprova" o una nuova scelta di foto.
let paused = false;
// La chiave non vale più (festa finita o ricominciata): serve un nuovo QR.
let expired = false;

$("files").addEventListener("change", (event) => {
  const files = Array.from(event.target.files || []);
  event.target.value = "";
  if (expired) {
    showBanner(T.expired, false);
    return;
  }
  for (const file of files) {
    queue.push({ file, item: addRow(file.name || "foto"), uploadId: randomId(), prepared: null });
    total++;
  }
  updateSummary();
  resume();
});

$("retry").addEventListener("click", resume);

function resume() {
  if (expired) return;
  paused = false;
  hideBanner();
  for (const job of queue) setState(job.item, T.waiting);
  if (!running) run();
}

function randomId() {
  const bytes = new Uint8Array(12);
  crypto.getRandomValues(bytes);
  return Array.from(bytes, (b) => b.toString(16).padStart(2, "0")).join("");
}

function addRow(name) {
  const li = document.createElement("li");
  const thumb = document.createElement("div");
  thumb.className = "thumb";
  const text = document.createElement("div");
  text.className = "text";
  const label = document.createElement("div");
  label.className = "name";
  label.textContent = name;
  const state = document.createElement("div");
  state.className = "state";
  state.textContent = T.waiting;
  const bar = document.createElement("progress");
  bar.max = 1;
  bar.value = 0;
  bar.hidden = true;
  text.append(label, state, bar);
  li.append(thumb, text);
  $("list").prepend(li);
  return { li, thumb, state, bar };
}

function setState(item, text, kind) {
  item.state.textContent = text;
  item.li.className = kind || "";
}

function updateSummary() {
  $("summary").textContent = total ? T.summary(done, total) : "";
}

function showBanner(text, withRetry) {
  $("bannerText").textContent = text;
  $("retry").hidden = !withRetry;
  $("banner").style.display = "block";
}

function hideBanner() {
  $("banner").style.display = "none";
}

async function run() {
  running = true;
  try {
    while (queue.length && !paused && !expired) {
      const job = queue[0];
      let outcome;
      try {
        outcome = await processOne(job);
      } catch (e) {
        outcome = "failed";
        setState(job.item, T.failed, "err");
      }
      if (outcome === "offline" || outcome === "quiet") {
        // La foto resta in testa alla coda: "Riprova" ricomincia da lei.
        paused = true;
        if (outcome === "offline") setState(job.item, T.failed, "err");
        showBanner(outcome === "quiet" ? T.quietRefused : T.offline, true);
        break;
      }
      queue.shift();
      job.prepared = null;
      if (outcome === "expired") {
        expired = true;
        while (queue.length) setState(queue.shift().item, T.failed, "err");
        showBanner(T.expired, false);
      }
      updateSummary();
    }
  } finally {
    running = false;
  }
}

/** Prepara e invia una foto. Restituisce "done", "failed", "offline" o "expired". */
async function processOne(job) {
  const { file, item } = job;
  if (!job.prepared && isVideo(file)) {
    const checked = await prepareVideo(file, item);
    if (!checked) return "failed";
    job.prepared = checked;
  }
  if (!job.prepared) {
    setState(item, T.preparing);
    try {
      job.prepared = await resize(file);
    } catch (e) {
      const heic = /hei[cf]/i.test(file.type || "") || /\.hei[cf]$/i.test(file.name || "");
      setState(item, heic ? T.heic : T.unsupported, "err");
      return "failed";
    }
    if (!job.prepared.video && job.prepared.blob.size > CONFIG.maxBytes) {
      setState(item, T.tooLarge, "err");
      return "failed";
    }
    if (job.prepared.thumb) {
      item.thumb.style.backgroundImage = "url(" + URL.createObjectURL(job.prepared.thumb) + ")";
    }
  }
  item.bar.hidden = false;
  setState(item, T.sending);
  let result = await upload(job);
  for (const delay of RETRY_DELAYS) {
    if (![0, 429, 503].includes(result.status)) break;
    setState(item, T.retrying);
    await sleep(Math.max(delay, Math.min(result.retryAfter * 1000, 30000)));
    setState(item, T.sending);
    result = await upload(job);
  }
  item.bar.hidden = true;
  const error = result.body && result.body.error;
  if (result.status === 200) {
    done++;
    if (result.body && result.body.receipt) rememberSent(result.body.id, result.body.receipt, job.prepared.thumb, item);
    if (BOOTH) boothDone();
    if (result.body && result.body.status === "pending") setState(item, T.pending, "wait");
    else if (shots && shots.disposable && !shots.developed) setState(item, T.inRoll, "ok");
    else { setState(item, T.shown, "ok"); celebrate(); }
    if (shots && shots.left > 0) { shots.left--; showShots(); }
    return "done";
  }
  if (result.status === 403 && error === "limit") {
    setState(item, T.limitReached, "err");
    if (shots) { shots.left = 0; showShots(); }
    return "failed";
  }
  if (result.status === 423) {
    setState(item, T.quietRefused, "err");
    return "quiet";
  }
  if (result.status === 401 || result.status === 403 || result.status === 421) {
    setState(item, T.failed, "err");
    return "expired";
  }
  if ([0, 429, 503].includes(result.status)) return "offline";
  if (result.status === 413) setState(item, T.tooLarge, "err");
  else if (result.status === 415) setState(item, T.unsupported, "err");
  else if (result.status === 507) setState(item, error === "pending_full" ? T.pendingFull : T.full, "err");
  else setState(item, T.failed, "err");
  return "failed";
}

function sleep(ms) {
  return new Promise((resolve) => setTimeout(resolve, ms));
}

function loadImage(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const image = new Image();
    image.onload = () => { URL.revokeObjectURL(url); resolve(image); };
    image.onerror = () => { URL.revokeObjectURL(url); reject(new Error("decode")); };
    image.src = url;
  });
}

// Riduce la foto alla misura dello schermo della TV e la ricodifica in JPEG: l'orientamento viene
// applicato dal browser e i metadati (posizione, modello del telefono) non vengono copiati.
// Restituisce anche una miniatura per l'elenco, così nella pagina non restano foto grandi in memoria.
async function resize(file) {
  const image = await loadImage(file);
  const width = image.naturalWidth;
  const height = image.naturalHeight;
  if (!width || !height) throw new Error("size");
  const boxW = CONFIG.maxWidth;
  const boxH = CONFIG.maxHeight;
  let scale = CONFIG.fit === "cover" ? Math.max(boxW / width, boxH / height) : Math.min(boxW / width, boxH / height);
  scale = Math.min(1, scale);
  // Panorami molto lunghi in modalità "riempi": mai più di due schermi di pixel, e comunque mai più
  // di quello che la TV accetta (pixel totali e lato massimo), altrimenti rifiuterebbe la foto.
  const maxPixels = Math.min(boxW * boxH * 2, CONFIG.maxPixels || Infinity);
  const maxSide = CONFIG.maxSide || Infinity;
  if (width * height * scale * scale > maxPixels) scale = Math.sqrt(maxPixels / (width * height));
  if (Math.max(width, height) * scale > maxSide) scale = maxSide / Math.max(width, height);
  let targetW = Math.max(1, Math.round(width * scale));
  let targetH = Math.max(1, Math.round(height * scale));
  // L'arrotondamento non deve superare i limiti nemmeno di un pixel.
  if (targetW * targetH > maxPixels) {
    const k = Math.sqrt(maxPixels / (targetW * targetH));
    targetW = Math.max(1, Math.floor(targetW * k));
    targetH = Math.max(1, Math.floor(targetH * k));
  }
  targetW = Math.min(targetW, maxSide);
  targetH = Math.min(targetH, maxSide);

  // Riduzione a metà per passi: con un solo passaggio alcuni browser producono immagini seghettate.
  let source = image;
  let sourceW = width;
  let sourceH = height;
  const canvases = [];
  while (sourceW / 2 >= targetW && sourceH / 2 >= targetH) {
    const step = makeCanvas(Math.round(sourceW / 2), Math.round(sourceH / 2));
    step.context.drawImage(source, 0, 0, step.canvas.width, step.canvas.height);
    canvases.push(step.canvas);
    source = step.canvas;
    sourceW = step.canvas.width;
    sourceH = step.canvas.height;
  }
  const final = makeCanvas(targetW, targetH);
  final.context.fillStyle = "#000";
  final.context.fillRect(0, 0, targetW, targetH);
  final.context.drawImage(source, 0, 0, targetW, targetH);
  drawSignature(final.context, targetW, targetH);
  let blob = await toJpeg(final.canvas, CONFIG.quality);
  if (blob && blob.size > CONFIG.maxBytes) blob = await toJpeg(final.canvas, 0.7);
  const thumbScale = Math.min(1, 240 / Math.max(targetW, targetH));
  const small = makeCanvas(Math.max(1, Math.round(targetW * thumbScale)), Math.max(1, Math.round(targetH * thumbScale)));
  small.context.drawImage(final.canvas, 0, 0, small.canvas.width, small.canvas.height);
  const thumb = await toJpeg(small.canvas, 0.7);
  // Su iPhone i canvas restano in memoria finché non si azzerano le dimensioni.
  for (const canvas of canvases.concat(final.canvas, small.canvas)) { canvas.width = 0; canvas.height = 0; }
  if (!blob) throw new Error("encode");
  return { blob, thumb };
}

function makeCanvas(width, height) {
  const canvas = document.createElement("canvas");
  canvas.width = width;
  canvas.height = height;
  const context = canvas.getContext("2d");
  context.imageSmoothingEnabled = true;
  context.imageSmoothingQuality = "high";
  return { canvas, context };
}

function toJpeg(canvas, quality) {
  return new Promise((resolve) => canvas.toBlob(resolve, "image/jpeg", quality));
}

function isVideo(file) {
  return /^video\//.test(file.type || "") || /\.(mp4|mov|m4v|webm)$/i.test(file.name || "");
}

// Video brevi: si controllano durata e dimensione prima di mandarli, e il primo fotogramma fa da miniatura.
async function prepareVideo(file, item) {
  if (!videoOn) { setState(item, T.videoOff, "err"); return null; }
  if (file.size > (CONFIG.maxVideoBytes || 0)) { setState(item, T.videoTooLarge, "err"); return null; }
  setState(item, T.preparing);
  const url = URL.createObjectURL(file);
  try {
    const video = document.createElement("video");
    video.muted = true;
    video.playsInline = true;
    video.preload = "metadata";
    video.src = url;
    await new Promise((resolve, reject) => {
      video.onloadedmetadata = resolve;
      video.onerror = () => reject(new Error("video"));
      setTimeout(() => reject(new Error("timeout")), 10000);
    });
    if (isFinite(video.duration) && video.duration > (CONFIG.videoSeconds || 30) + 1) {
      setState(item, T.videoTooLong.replace("%d", CONFIG.videoSeconds || 30), "err");
      return null;
    }
    let thumb = null;
    try {
      video.currentTime = Math.min(0.5, (video.duration || 1) / 2);
      await new Promise((resolve) => { video.onseeked = resolve; setTimeout(resolve, 3000); });
      const scale = Math.min(1, 240 / Math.max(video.videoWidth || 1, video.videoHeight || 1));
      const small = makeCanvas(Math.max(1, Math.round((video.videoWidth || 240) * scale)), Math.max(1, Math.round((video.videoHeight || 240) * scale)));
      small.context.drawImage(video, 0, 0, small.canvas.width, small.canvas.height);
      thumb = await toJpeg(small.canvas, 0.7);
      small.canvas.width = 0; small.canvas.height = 0;
    } catch (e) {}
    if (thumb) item.thumb.style.backgroundImage = "url(" + URL.createObjectURL(thumb) + ")";
    return { blob: file, thumb, video: true };
  } catch (e) {
    setState(item, T.unsupported, "err");
    return null;
  } finally {
    URL.revokeObjectURL(url);
  }
}

function upload(job) {
  return new Promise((resolve) => {
    const request = new XMLHttpRequest();
    const video = !!job.prepared.video;
    request.open("POST", video ? "/videos" : "/photos");
    request.timeout = video ? 300000 : 120000;
    request.setRequestHeader("Content-Type", video ? (job.file.type || "video/mp4") : "image/jpeg");
    request.setRequestHeader("X-FotoFesta-Key", KEY);
    // Lo stesso identificativo a ogni tentativo: la TV non salva due volte la stessa foto.
    request.setRequestHeader("X-FotoFesta-Upload", job.uploadId);
    // Per contare gli scatti a testa quando la TV ha un limite.
    request.setRequestHeader("X-FotoFesta-Player", PLAYER);
    // Taglio per caratteri e non per unità UTF-16: un'emoji tagliata a metà non sarebbe codificabile.
    const sender = Array.from(senderInput.value.trim()).slice(0, 40).join("");
    if (sender) request.setRequestHeader("X-FotoFesta-Sender", encodeURIComponent(sender));
    request.upload.onprogress = (event) => {
      if (event.lengthComputable) job.item.bar.value = event.loaded / event.total;
    };
    request.onload = () => {
      let body = null;
      try { body = JSON.parse(request.responseText); } catch (e) {}
      const retryAfter = parseInt(request.getResponseHeader("Retry-After") || "0", 10) || 0;
      resolve({ status: request.status, body, retryAfter });
    };
    request.onerror = () => resolve({ status: 0, retryAfter: 0 });
    request.ontimeout = () => resolve({ status: 0, retryAfter: 0 });
    request.send(job.prepared.blob);
  });
}

// Coriandoli per un momento di festa: foto arrivata sulla TV, parola indovinata.
function celebrate() {
  if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  let canvas = $("confetti");
  if (!canvas) {
    canvas = document.createElement("canvas");
    canvas.id = "confetti";
    canvas.setAttribute("aria-hidden", "true");
    document.body.appendChild(canvas);
  }
  const ratio = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = innerWidth * ratio;
  canvas.height = innerHeight * ratio;
  const context = canvas.getContext("2d");
  context.scale(ratio, ratio);
  const colors = ["#ff7a57", "#ff4f9a", "#8b6cff", "#ffc145", "#4cd787", "#3da9fc"];
  const pieces = Array.from({ length: 90 }, () => ({
    x: innerWidth / 2 + (Math.random() - .5) * 80, y: innerHeight * .55,
    vx: (Math.random() - .5) * 9, vy: -7 - Math.random() * 8,
    size: 5 + Math.random() * 6, spin: Math.random() * 6, turn: (Math.random() - .5) * .4,
    color: colors[Math.floor(Math.random() * colors.length)],
  }));
  const started = performance.now();
  (function frame(now) {
    const elapsed = now - started;
    context.clearRect(0, 0, innerWidth, innerHeight);
    pieces.forEach((p) => {
      p.vy += .32; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.spin += p.turn;
      context.save();
      context.globalAlpha = Math.max(0, 1 - elapsed / 1800);
      context.translate(p.x, p.y); context.rotate(p.spin);
      context.fillStyle = p.color;
      context.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
      context.restore();
    });
    if (elapsed < 1800) requestAnimationFrame(frame);
    else context.clearRect(0, 0, innerWidth, innerHeight);
  })(started);
}

// Silent disco: il telefono suona il brano della TV e si riallinea quando si sposta di oltre 0,35 s.
const disco = { state: null, at: 0, on: false, track: null, error: false };
const discoAudio = $("discoAudio");
$("discoTitle").textContent = T.discoTitle;
$("discoBody").textContent = T.discoBody;

function showDisco(state) {
  disco.state = state && state.on ? state : null;
  disco.at = performance.now();
  $("disco").hidden = !disco.state;
  if (!disco.state) stopDisco();
  else syncDisco();
  renderDisco();
}

function discoTarget() {
  const s = disco.state;
  let seconds = (s.position + (s.playing ? performance.now() - disco.at : 0)) / 1000;
  // Un brano solo si ripete sulla TV: la posizione continua a crescere.
  if (isFinite(discoAudio.duration) && discoAudio.duration > 0) seconds %= discoAudio.duration;
  return seconds;
}

function syncDisco() {
  const s = disco.state;
  if (!disco.on || !s || disco.error) return;
  if (!s.track || !s.playing) { discoAudio.pause(); return; }
  if (disco.track !== s.track) {
    disco.track = s.track;
    discoAudio.src = "/disco/audio?k=" + encodeURIComponent(KEY) + "&t=" + encodeURIComponent(s.track);
  }
  if (discoAudio.readyState >= 1) {
    const target = discoTarget();
    if (Math.abs(discoAudio.currentTime - target) > 0.35) discoAudio.currentTime = target;
  }
  if (discoAudio.paused) discoAudio.play().catch(() => {});
}

function stopDisco() {
  disco.on = false;
  disco.track = null;
  discoAudio.pause();
  discoAudio.removeAttribute("src");
  discoAudio.load();
}

function renderDisco() {
  const button = $("discoToggle");
  button.textContent = disco.on ? T.discoStop : T.discoStart;
  button.classList.toggle("on", disco.on);
  const status = $("discoStatus");
  status.textContent = "";
  status.classList.remove("playing");
  if (!disco.on || !disco.state) return;
  let text = T.discoPlaying;
  if (disco.error) text = T.discoError;
  else if (!disco.state.track) text = T.discoWaiting;
  else if (!disco.state.playing) text = T.discoPaused;
  const playing = text === T.discoPlaying;
  if (playing) {
    const bars = document.createElement("span");
    bars.className = "bars";
    bars.setAttribute("aria-hidden", "true");
    for (let i = 0; i < 4; i++) bars.appendChild(document.createElement("i"));
    status.appendChild(bars);
    status.classList.toggle("playing", !discoAudio.paused);
  }
  status.appendChild(document.createTextNode(text));
}

// Il primo play deve partire dal tocco: i telefoni non suonano audio da soli.
$("discoToggle").addEventListener("click", () => {
  if (disco.on) stopDisco();
  else {
    disco.on = true;
    disco.error = false;
    syncDisco();
  }
  renderDisco();
});
discoAudio.addEventListener("loadedmetadata", () => { if (disco.on && disco.state) discoAudio.currentTime = discoTarget(); });
discoAudio.addEventListener("playing", renderDisco);
discoAudio.addEventListener("pause", renderDisco);
discoAudio.addEventListener("error", () => {
  if (!disco.on || !discoAudio.getAttribute("src")) return;
  disco.error = true;
  disco.track = null;
  renderDisco();
});

// Muro di telefoni: ogni telefono disegna il suo pezzo della foto, come se tutti insieme
// formassero un unico schermo di colonne × righe telefoni (della stessa misura di questo).
const phoneWall = { state: null, image: null, serial: -1, closed: false, busy: false, finale: null };
$("phoneWallTitle").textContent = T.phoneWallTitle;
$("phoneWallBody").textContent = T.phoneWallBody;
$("phoneWallJoin").textContent = T.phoneWallJoin;
$("phoneWallExit").textContent = "\u2715";
$("phoneWallExit").setAttribute("aria-label", T.phoneWallLeave);

function showPhoneWall(state) {
  phoneWall.state = state;
  const joined = !!(state && state.slot != null);
  if (!joined) phoneWall.closed = false;
  $("phoneWall").hidden = !state;
  $("phoneWallJoin").hidden = joined || (state && state.phase === "showing");
  let status = "";
  if (state && !joined && state.phase === "showing") status = T.phoneWallLate;
  else if (joined) status = T.phoneWallYou.replace("%d", state.slot + 1);
  $("phoneWallStatus").textContent = status;
  const screen = $("phoneWallScreen");
  screen.hidden = !joined || phoneWall.closed;
  if (screen.hidden) return;
  // Gran finale dalla TV: lampi di colore e coriandoli su tutti i telefoni insieme.
  if (phoneWall.finale !== null && state.finale > phoneWall.finale) wallFinale();
  phoneWall.finale = state.finale || 0;
  if (state.phase === "showing" && state.photo) {
    if (phoneWall.serial !== state.serial) {
      phoneWall.serial = state.serial;
      loadWallImage(state.photo, state.serial);
    }
  } else {
    phoneWall.serial = -1;
    phoneWall.image = null;
  }
  drawPhoneWall();
}

function wallFinale() {
  const screen = $("phoneWallScreen");
  const colors = ["#ff7a57", "#ff4f9a", "#8b6cff", "#ffc145", "#4cd787", "#fff"];
  let step = 0;
  const reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (!reduced) {
    const timer = setInterval(() => {
      screen.style.background = colors[step % colors.length];
      $("phoneWallCanvas").style.opacity = step % 2 ? "1" : "0.25";
      if (++step > 12) { clearInterval(timer); screen.style.background = ""; $("phoneWallCanvas").style.opacity = "1"; }
    }, 140);
  }
  celebrate();
}

async function loadWallImage(id, serial) {
  try {
    const response = await fetch("/wall/photo?k=" + encodeURIComponent(KEY) + "&id=" + encodeURIComponent(id), { cache: "force-cache" });
    if (!response.ok) return;
    const url = URL.createObjectURL(await response.blob());
    const image = new Image();
    image.onload = () => {
      if (phoneWall.serial !== serial) { URL.revokeObjectURL(url); return; }
      if (phoneWall.image) URL.revokeObjectURL(phoneWall.image.src);
      phoneWall.image = image;
      drawPhoneWall();
    };
    image.src = url;
  } catch (e) {}
}

function drawPhoneWall() {
  const state = phoneWall.state;
  const canvas = $("phoneWallCanvas");
  const image = phoneWall.image;
  const showing = !!(state && state.phase === "showing" && image);
  $("phoneWallNumber").hidden = showing;
  $("phoneWallHint").hidden = showing;
  if (state && !showing) {
    $("phoneWallNumber").textContent = state.slot + 1;
    $("phoneWallHint").textContent = T.phoneWallHint;
  }
  const context = canvas.getContext("2d");
  const ratio = Math.min(window.devicePixelRatio || 1, 2);
  const width = innerWidth, height = innerHeight;
  canvas.width = Math.round(width * ratio);
  canvas.height = Math.round(height * ratio);
  context.setTransform(ratio, 0, 0, ratio, 0, 0);
  context.fillStyle = "#000";
  context.fillRect(0, 0, width, height);
  if (!showing) return;
  // La foto copre tutto il muro; questo telefono ne mostra la sua casella.
  const columns = Math.max(1, state.columns | 0), rows = Math.max(1, state.rows | 0);
  const wallWidth = width * columns, wallHeight = height * rows;
  const scale = Math.max(wallWidth / image.naturalWidth, wallHeight / image.naturalHeight);
  const drawWidth = image.naturalWidth * scale, drawHeight = image.naturalHeight * scale;
  const left = (wallWidth - drawWidth) / 2 - (state.slot % columns) * width;
  const top = (wallHeight - drawHeight) / 2 - Math.floor(state.slot / columns) * height;
  context.drawImage(image, left, top, drawWidth, drawHeight);
}

async function joinPhoneWall() {
  if (phoneWall.busy) return;
  phoneWall.busy = true;
  phoneWall.closed = false;
  try {
    const response = await sendAction({ type: "wall", command: "join" });
    if (!response.ok) $("phoneWallStatus").textContent = response.status === 507 ? T.phoneWallFull : (response.status === 409 ? T.phoneWallLate : T.offline);
  } catch (e) {
    $("phoneWallStatus").textContent = T.offline;
  }
  phoneWall.busy = false;
  pollGame();
}

$("phoneWallJoin").addEventListener("click", joinPhoneWall);
$("phoneWallExit").addEventListener("click", () => {
  phoneWall.closed = true;
  $("phoneWallScreen").hidden = true;
  sendAction({ type: "wall", command: "leave" }).catch(() => {}).then(pollGame);
});
window.addEventListener("resize", () => { if (!$("phoneWallScreen").hidden) drawPhoneWall(); });

function roundedImage(context, image, x, y, w, h, r) {
  context.save();
  context.beginPath();
  context.moveTo(x + r, y);
  context.arcTo(x + w, y, x + w, y + h, r);
  context.arcTo(x + w, y + h, x, y + h, r);
  context.arcTo(x, y + h, x, y, r);
  context.arcTo(x, y, x + w, y, r);
  context.closePath();
  context.clip();
  const scale = Math.max(w / image.naturalWidth, h / image.naturalHeight);
  const dw = image.naturalWidth * scale, dh = image.naturalHeight * scale;
  context.drawImage(image, x + (w - dw) / 2, y + (h - dh) / 2, dw, dh);
  context.restore();
}

function partyBackground(context, width, height) {
  const gradient = context.createLinearGradient(0, 0, width, height);
  gradient.addColorStop(0, "#ff7a57");
  gradient.addColorStop(0.55, "#ff4f9a");
  gradient.addColorStop(1, "#8b6cff");
  context.fillStyle = gradient;
  context.fillRect(0, 0, width, height);
  const colors = ["#ffc145", "#ffffff", "#4cd787", "#0d0f13"];
  for (let i = 0; i < 70; i++) {
    context.fillStyle = colors[i % colors.length];
    context.globalAlpha = 0.35;
    context.save();
    context.translate((i * 397) % width, (i * 613) % height);
    context.rotate(i);
    context.fillRect(-9, -4, 18, 8);
    context.restore();
  }
  context.globalAlpha = 1;
}

function wrapText(context, text, x, y, maxWidth, lineHeight, maxLines) {
  const words = String(text).split(/\s+/);
  let line = "";
  let lines = 0;
  for (const word of words) {
    const test = line ? line + " " + word : word;
    if (context.measureText(test).width > maxWidth && line) {
      context.fillText(line, x, y);
      y += lineHeight;
      line = word;
      if (++lines >= maxLines - 1) break;
    } else line = test;
  }
  if (line) context.fillText(line, x, y);
  return y + lineHeight;
}

function saveCanvas(canvas, name, link) {
  return new Promise((resolve) => canvas.toBlob((blob) => {
    if (!blob) return resolve(false);
    const url = URL.createObjectURL(blob);
    if (link) {
      link.href = url;
      link.download = name;
      link.hidden = false;
    } else {
      const a = document.createElement("a");
      a.href = url;
      a.download = name;
      document.body.appendChild(a);
      a.click();
      a.remove();
    }
    resolve(true);
  }, "image/png"));
}

// Firma: disegnata sul riquadro, salvata in questo telefono, aggiunta alle foto se spuntata.
const SIGN_KEY = "fotofesta.signature";
const signPad = $("signPad");
const signContext = signPad.getContext("2d");
let signatureImage = null;
let signOn = false;
$("signTitle").textContent = T.signTitle;
$("signOnLabel").textContent = T.signOn;
$("signClear").textContent = T.signClear;
try {
  signOn = localStorage.getItem(SIGN_KEY + ".on") === "1";
  const saved = localStorage.getItem(SIGN_KEY);
  if (saved) {
    signatureImage = new Image();
    signatureImage.onload = () => signContext.drawImage(signatureImage, 0, 0);
    signatureImage.src = saved;
  }
} catch (e) {}
$("signOn").checked = signOn;
$("signOn").addEventListener("change", () => {
  signOn = $("signOn").checked;
  try { localStorage.setItem(SIGN_KEY + ".on", signOn ? "1" : "0"); } catch (e) {}
});
let signing = false, signLast = null;
function signPoint(event) {
  const box = signPad.getBoundingClientRect();
  return { x: (event.clientX - box.left) * signPad.width / box.width, y: (event.clientY - box.top) * signPad.height / box.height };
}
signPad.addEventListener("pointerdown", (event) => {
  signing = true;
  signLast = signPoint(event);
  signPad.setPointerCapture(event.pointerId);
});
signPad.addEventListener("pointermove", (event) => {
  if (!signing) return;
  const point = signPoint(event);
  signContext.strokeStyle = "#111";
  signContext.lineWidth = 7;
  signContext.lineCap = "round";
  signContext.lineJoin = "round";
  signContext.beginPath();
  signContext.moveTo(signLast.x, signLast.y);
  signContext.lineTo(point.x, point.y);
  signContext.stroke();
  signLast = point;
});
function endSign() {
  if (!signing) return;
  signing = false;
  const url = signPad.toDataURL("image/png");
  signatureImage = new Image();
  signatureImage.src = url;
  try { localStorage.setItem(SIGN_KEY, url); } catch (e) {}
  if (!signOn) { signOn = true; $("signOn").checked = true; try { localStorage.setItem(SIGN_KEY + ".on", "1"); } catch (e) {} }
}
signPad.addEventListener("pointerup", endSign);
signPad.addEventListener("pointercancel", endSign);
$("signClear").addEventListener("click", () => {
  signContext.clearRect(0, 0, signPad.width, signPad.height);
  signatureImage = null;
  try { localStorage.removeItem(SIGN_KEY); } catch (e) {}
});
// La firma in bianco con un'ombra, in basso a destra: si legge su foto chiare e scure.
function drawSignature(context, width, height) {
  if (!signOn || !signatureImage || !signatureImage.complete || !signatureImage.naturalWidth) return;
  const w = Math.round(Math.min(width, height) * 0.42);
  const h = Math.round(w * signatureImage.naturalHeight / signatureImage.naturalWidth);
  const tinted = document.createElement("canvas");
  tinted.width = w; tinted.height = h;
  const t = tinted.getContext("2d");
  t.drawImage(signatureImage, 0, 0, w, h);
  t.globalCompositeOperation = "source-in";
  t.fillStyle = "#fff";
  t.fillRect(0, 0, w, h);
  context.save();
  context.shadowColor = "rgba(0,0,0,.7)";
  context.shadowBlur = Math.max(4, w / 60);
  context.drawImage(tinted, width - w - width * 0.03, height - h - height * 0.03);
  context.restore();
  tinted.width = 0; tinted.height = 0;
}

  $("schedule").hidden = !schedule.length;

    li.append(time, title);

  });
}

// Logo e sponsor: ridotti sul telefono prima di mandarli (al massimo 1280 pixel per lato).
async function shrinkImage(file, maxSide, type) {
  const image = await loadImage(file);
  const scale = Math.min(1, maxSide / Math.max(image.naturalWidth, image.naturalHeight));
  const canvas = makeCanvas(Math.max(1, Math.round(image.naturalWidth * scale)), Math.max(1, Math.round(image.naturalHeight * scale)));
  canvas.context.drawImage(image, 0, 0, canvas.canvas.width, canvas.canvas.height);
  const blob = await new Promise((resolve) => canvas.canvas.toBlob(resolve, type, 0.88));
  canvas.canvas.width = 0; canvas.canvas.height = 0;
  return blob;
}
async function uploadSetupImage(file, kind, name) {
  $("setupStatus").textContent = T.setupUploading;
  try {
    const blob = await shrinkImage(file, kind === "logo" ? 512 : 1280, kind === "logo" ? "image/png" : "image/jpeg");
    const response = await fetch("/party/host/upload?kind=" + kind + (name ? "&name=" + encodeURIComponent(name) : ""), {
      method: "POST",
      headers: { "X-FotoFesta-Key": KEY, "X-FotoFesta-Host": hostToken, "Content-Type": blob.type },
      body: blob,
    });
    if (response.ok) { logoVersion++; setupDone(); pollHost(); return; }
    $("setupStatus").textContent = response.status === 507 ? (kind === "kid" ? T.setupKidsFull : T.setupFull) : T.offline;
  } catch (e) {
    $("setupStatus").textContent = T.unsupported;
  }
}
