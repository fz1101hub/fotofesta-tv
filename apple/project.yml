# Progetto Xcode dell'app Apple TV, generato con XcodeGen: `brew install xcodegen && xcodegen generate`.
name: FotoFestaTV
options:
  bundleIdPrefix: it.fotofesta
  developmentLanguage: en
  deploymentTarget:
    tvOS: "17.0"
packages:
  FotoFestaCore:
    path: FotoFestaCore
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "2"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  FotoFestaTV:
    type: application
    platform: tvOS
    sources:
      - path: FotoFestaTV/Sources
      - path: FotoFestaTV/Resources
      # Pagina che i telefoni degli invitati aprono: la stessa dell'app Android.
      - path: ../shared/assets/guest/index.html
        buildPhase: resources
    dependencies:
      - package: FotoFestaCore
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.fotofesta.tv
        PRODUCT_NAME: FotoFesta TV
        TARGETED_DEVICE_FAMILY: "3"
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        LOCALIZATION_PREFERS_STRING_CATALOGS: NO
    info:
      path: FotoFestaTV/Info.plist
      properties:
        CFBundleDisplayName: FotoFesta TV
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, it, fr, es, de]
        LSApplicationCategoryType: public.app-category.photography
        UIRequiredDeviceCapabilities: [arm64]
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        # Figtree (SIL OFL, Figtree-OFL.txt), lo stesso carattere dell'app Android.
        UIAppFonts: [Figtree-Regular.ttf, Figtree-Medium.ttf, Figtree-SemiBold.ttf, Figtree-Bold.ttf, Figtree-ExtraBold.ttf]
        ITSAppUsesNonExemptEncryption: false
        NSLocalNetworkUsageDescription: "FotoFesta TV receives the photos your guests send from their phones over your home network."
        PhotosClientID: $(PHOTOS_CLIENT_ID)
        PhotosClientSecret: $(PHOTOS_CLIENT_SECRET)
        # Indirizzo pubblico di site/privacy/ (vedi docs/PUBLISHING.md): l'app lo mostra come QR nelle impostazioni.
        PrivacyPolicyURL: "https://EXAMPLE.github.io/fotofesta-tv/privacy/"
schemes:
  FotoFestaTV:
    build:
      targets:
        FotoFestaTV: all
    run:
      config: Debug
    archive:
      config: Release
